<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoachView — Upload Video</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-page="upload">
  <header class="site-header">
    <div class="site-brand">CoachView</div>
    <nav class="site-nav">
      <a href="/">Home</a>
      <a href="/register.html">Register</a>
      <a href="/login.html">Login</a>
      <a href="/videos.html">Videos</a>
      <a href="/profile.html">Profile</a>
      <a href="/about.html">About</a>
    </nav>
  </header>
  <main class="page-shell">
    <section class="panel">
      <h1>Upload workout video</h1>
      <p>Coaches can upload large workout videos. The app stores upload metadata and serves the file from the uploads folder.</p>
      <div id="message-box" class="message info">Only coaches can upload videos. Sign in first.</div>
      <form id="upload-form" class="form-card">
        <label>Title</label>
        <input type="text" name="title" required />
        <label>Description</label>
        <textarea name="description" rows="4"></textarea>
        <label>Video file</label>
        <input type="file" name="video" accept="video/*" required />
        <button type="submit">Upload video</button>
      </form>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
